# Render Blueprint – https://render.com/docs/blueprint-spec
# Minden push a main ágra automatikusan új deployt indít.
services:
  - type: web
    name: lap-by-lap
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # A Strava-kulcsok titkosak: nem kerülnek a repóba, a Render felületén kell megadni őket.
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
