# Minden push a main ágra: Docker-image a GHCR-be, majd új deploy a Northflankon.
name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      NF_TOKEN: ${{ secrets.NORTHFLANK_TOKEN }}
      NF_PROJECT: ${{ vars.NORTHFLANK_PROJECT }}
      NF_SERVICE: ${{ vars.NORTHFLANK_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Northflank
        if: ${{ env.NF_TOKEN != '' && env.NF_PROJECT != '' && env.NF_SERVICE != '' }}
        run: |
          curl -fsS -X PATCH "https://api.northflank.com/v1/projects/${NF_PROJECT}/services/deployment/${NF_SERVICE}" \
            -H "Authorization: Bearer ${NF_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"deployment\":{\"instances\":1,\"external\":{\"imagePath\":\"${IMAGE}:${GITHUB_SHA}\"}}}" > /dev/null
          echo "Deployed ${IMAGE}:${GITHUB_SHA}"
