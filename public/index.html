<!doctype html>
<html lang="en" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lap by Lap</title>
  <meta name="description" content="Print-ready photo books from your real Strava activities and photos.">
  <meta name="theme-color" content="#F6F2EC">
  <meta name="onesvibe-claim" content="ov-d7d62588-f5db-43d4-b6f4-bea92256bfab">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/fraunces/600SemiBold/Fraunces_600SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Lap by Lap">
      <svg class="brand-mark" viewBox="0 0 28 32" aria-hidden="true"><rect x="2" y="1" width="24" height="30" rx="3"/><rect x="2" y="1" width="4" height="30" rx="2" class="spine"/><path d="M10 22l4.5-8 3.5 5 2-3 3.5 6z" class="peak"/></svg>
      <span>Lap by Lap</span>
    </a>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="hu">HU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div id="user" class="user" hidden>
        <img id="user-avatar" alt="" width="30" height="30">
        <span id="user-name"></span>
        <button type="button" id="logout" class="link" data-i18n="nav.logout"></button>
      </div>
    </div>
  </header>

  <div id="alert" class="alert" role="alert" hidden></div>

  <!-- ============================== Kezdőoldal ============================== -->
  <main id="landing" class="landing" hidden>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-cta">
          <a id="connect" class="btn btn-strava" href="/auth/login" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 17.9l-2.1-4.1h-3.1L15.4 24l5.1-10.2h-3.1zM10.4 8.1l2.8 5.6h4.2L10.4 0 3.5 13.7h4.1z"/></svg>
            <span data-i18n="hero.connect"></span>
          </a>
          <a class="link" href="#how" data-i18n="hero.how"></a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="book book-lg" id="hero-book">
          <div class="book-cover" id="hero-cover">
            <svg class="book-routes" viewBox="0 0 120 80"><path d="M8 60c10-25 22-30 30-18s12 14 20-4 18-22 26-8 12 20 28 6"/><path d="M14 72c14-8 30-6 40-14s20-6 30 2 18 6 28-4"/></svg>
            <div class="book-bar"></div>
            <div class="book-title" data-i18n-html="hero.bookTitle"></div>
            <div class="book-meta">2025</div>
          </div>
        </div>
      </div>
    </section>

    <section class="features">
      <article><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 0v14m6-12v14"/></svg><h3 data-i18n="feat.map.t"></h3><p data-i18n="feat.map.d"></p></article>
      <article><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg><h3 data-i18n="feat.year.t"></h3><p data-i18n="feat.year.d"></p></article>
      <article><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 01-1-1v-6a2 2 0 012-2h14a2 2 0 012 2v6a1 1 0 01-1 1h-2M6 14h12v7H6z"/></svg><h3 data-i18n="feat.print.t"></h3><p data-i18n="feat.print.d"></p></article>
      <article><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><h3 data-i18n="feat.fast.t"></h3><p data-i18n="feat.fast.d"></p></article>
    </section>

    <section class="sample" id="sample">
      <p class="eyebrow" data-i18n="sample.eyebrow"></p>
      <h2 data-i18n="sample.title"></h2>
      <p class="lead" data-i18n="sample.lead"></p>
      <div id="flipbook"></div>
      <p class="sample-note" data-i18n="sample.note"></p>
    </section>

    <section id="how" class="how">
      <ol>
        <li><span>1</span><p data-i18n="how.1"></p></li>
        <li><span>2</span><p data-i18n="how.2"></p></li>
        <li><span>3</span><p data-i18n="how.3"></p></li>
      </ol>
    </section>

    <section id="setup" class="card setup" hidden>
      <h2 data-i18n="setup.title"></h2>
      <p data-i18n="setup.lead"></p>
      <ol>
        <li data-i18n-html="setup.1"></li>
        <li><span data-i18n-html="setup.2"></span> <code id="cb-domain">localhost</code></li>
        <li data-i18n-html="setup.3"></li>
        <li data-i18n-html="setup.4"></li>
      </ol>
    </section>
  </main>

  <!-- ============================== Munkaterület ============================== -->
  <main id="app" class="workspace" hidden>
    <form id="form" class="steps" autocomplete="off" novalidate>

      <section class="card step" id="step-source">
        <header class="step-head"><span class="step-no">1</span><h2 data-i18n="step.source"></h2></header>
        <p class="muted" data-i18n="sync.lead"></p>
        <div class="row">
          <button type="button" id="sync" class="btn" data-i18n="sync.load"></button>
          <span id="sync-status" class="muted small"></span>
        </div>
        <div class="sync-anim" id="sync-anim" hidden aria-live="polite">
          <svg viewBox="0 0 320 90" aria-hidden="true">
            <path class="sync-track" d="M12 66 C 48 18, 82 22, 104 50 S 150 86, 176 52 S 224 8, 252 34 S 296 78, 308 30"/>
            <path class="sync-route" d="M12 66 C 48 18, 82 22, 104 50 S 150 86, 176 52 S 224 8, 252 34 S 296 78, 308 30"/>
            <circle class="sync-start" cx="12" cy="66" r="5"/>
            <circle class="sync-runner" r="6"/>
          </svg>
          <div class="sync-count"><b id="sync-n">0</b><span data-i18n="sync.loaded"></span></div>
          <p class="sync-msg" id="sync-msg"></p>
        </div>
        <div id="summary" class="stats" hidden></div>

        <div class="archive">
          <div class="archive-head">
            <h3 data-i18n="arch.title"></h3><span class="badge" data-i18n="arch.badge"></span>
          </div>
          <p class="small" data-i18n="arch.lead"></p>
          <ol class="small">
            <li data-i18n-html="arch.s1"></li>
            <li data-i18n="arch.s2"></li>
            <li data-i18n="arch.s3"></li>
          </ol>
          <div class="row">
            <label class="btn btn-file"><input type="file" id="archive" accept=".zip,application/zip"><span data-i18n="arch.choose"></span></label>
            <span id="archive-status" class="small"></span>
          </div>
          <div class="bar slim" id="archive-bar" hidden><div></div></div>
        </div>
      </section>

      <section class="card step" id="step-select" hidden>
        <header class="step-head"><span class="step-no">2</span><h2 data-i18n="step.select"></h2></header>
        <div class="field">
          <span class="label" data-i18n="sel.period"></span>
          <div class="chips" id="year-chips"></div>
          <div class="row">
            <label class="inline"><span data-i18n="sel.from"></span> <input type="date" name="from"></label>
            <label class="inline"><span data-i18n="sel.to"></span> <input type="date" name="to"></label>
          </div>
        </div>
        <div class="field">
          <span class="label" data-i18n="sel.sports"></span>
          <div class="chips" id="type-chips"></div>
        </div>
        <div class="grid2">
          <div class="toggles">
            <label class="toggle"><input type="checkbox" name="onlyPhotos"><span data-i18n="sel.onlyPhotos"></span></label>
            <label class="toggle"><input type="checkbox" name="excludePrivate"><span data-i18n="sel.noPrivate"></span></label>
            <label class="toggle"><input type="checkbox" name="excludeCommute"><span data-i18n="sel.noCommute"></span></label>
            <label class="toggle"><input type="checkbox" name="excludeIndoor"><span data-i18n="sel.noIndoor"></span></label>
          </div>
          <div>
            <label class="field compact"><span class="label" data-i18n="sel.maxPhotos"></span>
              <select name="maxPhotos" id="maxPhotos"></select></label>
            <label class="field compact"><span class="label" data-i18n="sel.minKm"></span>
              <input type="number" name="minKm" min="0" max="500" step="1" value="0"></label>
          </div>
        </div>
        <details class="picker">
          <summary><span data-i18n="sel.pick"></span> <span id="picker-count" class="muted"></span> <span id="fav-count" class="fav-count"></span></summary>
          <p class="small muted picker-hint" data-i18n="sel.favHint"></p>
          <div class="picker-tools">
            <input type="search" id="picker-search" data-i18n-ph="sel.search">
            <button type="button" class="link" id="picker-all" data-i18n="sel.allBtn"></button>
            <button type="button" class="link" id="picker-none" data-i18n="sel.noneBtn"></button>
          </div>
          <div class="picker-list" id="picker-list"></div>
        </details>
      </section>

      <section class="card step">
        <header class="step-head"><span class="step-no">3</span><h2 data-i18n="step.design"></h2></header>
        <div class="grid2">
          <label class="field"><span class="label" data-i18n="des.title"></span><input name="title" maxlength="80" value="Lap by Lap"></label>
          <label class="field"><span class="label" data-i18n="des.subtitle"></span><input name="subtitle" maxlength="120" data-i18n-ph="des.subtitlePh"></label>
        </div>
        <label class="field"><span class="label"><span data-i18n="des.dedication"></span> <span class="muted" data-i18n="des.optional"></span></span>
          <textarea name="dedication" rows="2" maxlength="600" data-i18n-ph="des.dedicationPh"></textarea></label>
        <div class="field">
          <span class="label" data-i18n="des.layout"></span>
          <div class="layouts">
            <label class="layout-card"><input type="radio" name="layout" value="magazine" checked>
              <svg viewBox="0 0 60 80" aria-hidden="true"><rect x="0" y="0" width="60" height="34" class="ph"/><rect x="6" y="40" width="30" height="4" class="tx"/><rect x="6" y="48" width="10" height="5" class="ac"/><rect x="19" y="48" width="10" height="5" class="ac"/><rect x="32" y="48" width="10" height="5" class="ac"/><rect x="6" y="58" width="18" height="14" class="mp"/><path d="M28 70l6-6 5 3 6-7 7 10z" class="ln"/></svg>
              <strong data-i18n="lay.magazine"></strong><small data-i18n="lay.magazineD"></small></label>
            <label class="layout-card"><input type="radio" name="layout" value="gallery">
              <svg viewBox="0 0 60 80" aria-hidden="true"><rect x="0" y="0" width="60" height="46" class="ph"/><rect x="6" y="51" width="26" height="4" class="tx"/><rect x="6" y="58" width="40" height="2" class="tx2"/><rect x="6" y="64" width="23" height="12" class="ph2"/><rect x="31" y="64" width="23" height="12" class="ph2"/></svg>
              <strong data-i18n="lay.gallery"></strong><small data-i18n="lay.galleryD"></small></label>
            <label class="layout-card"><input type="radio" name="layout" value="journal">
              <svg viewBox="0 0 60 80" aria-hidden="true"><rect x="6" y="8" width="34" height="5" class="tx"/><rect x="6" y="17" width="40" height="2" class="tx2"/><rect x="6" y="24" width="2" height="26" class="ac"/><rect x="11" y="24" width="43" height="2" class="tx2"/><rect x="11" y="29" width="40" height="2" class="tx2"/><rect x="11" y="34" width="43" height="2" class="tx2"/><rect x="11" y="39" width="36" height="2" class="tx2"/><rect x="11" y="44" width="41" height="2" class="tx2"/><rect x="6" y="56" width="48" height="18" class="ph2"/></svg>
              <strong data-i18n="lay.journal"></strong><small data-i18n="lay.journalD"></small></label>
          </div>
        </div>
        <div class="field">
          <span class="label" data-i18n="des.format"></span>
          <div class="sizes" id="sizes"></div>
        </div>
        <div>
          <div class="field">
            <span class="label" data-i18n="des.tone"></span>
            <div class="seg tones">
              <label><input type="radio" name="tone" value="white" checked><span><i class="dot dot-white"></i><span data-i18n="tone.white"></span></span></label>
              <label><input type="radio" name="tone" value="cream"><span><i class="dot dot-cream"></i><span data-i18n="tone.cream"></span></span></label>
              <label><input type="radio" name="tone" value="night"><span><i class="dot dot-night"></i><span data-i18n="tone.night"></span></span></label>
            </div>
          </div>
          <div class="field">
            <span class="label" data-i18n="des.type"></span>
            <div class="seg">
              <label><input type="radio" name="typeface" value="classic" checked><span class="f-classic" data-i18n="des.classic"></span></label>
              <label><input type="radio" name="typeface" value="modern"><span class="f-modern" data-i18n="des.modern"></span></label>
              <label><input type="radio" name="typeface" value="sport"><span class="f-sport" data-i18n="des.sport"></span></label>
              <label><input type="radio" name="typeface" value="elegant"><span class="f-elegant" data-i18n="des.elegant"></span></label>
            </div>
          </div>
        </div>
        <div class="field">
          <span class="label" data-i18n="des.theme"></span>
          <div class="themes" id="themes"></div>
          <label class="custom-color"><input type="checkbox" name="useAccent"><span data-i18n="des.customColor"></span>
            <input type="color" name="accent" value="#0B6E4F" aria-label="Accent"></label>
        </div>
        <div class="grid2">
          <div class="field">
            <span class="label" data-i18n="des.coverStyle"></span>
            <div class="seg">
              <label><input type="radio" name="coverStyle" value="photo" checked><span data-i18n="des.coverPhoto"></span></label>
              <label><input type="radio" name="coverStyle" value="routes"><span data-i18n="des.coverRoutes"></span></label>
            </div>
          </div>
          <div class="field">
            <span class="label" data-i18n="des.titlePos"></span>
            <div class="seg">
              <label><input type="radio" name="titlePos" value="bottom" checked><span data-i18n="pos.bottom"></span></label>
              <label><input type="radio" name="titlePos" value="center"><span data-i18n="pos.center"></span></label>
              <label><input type="radio" name="titlePos" value="top"><span data-i18n="pos.top"></span></label>
            </div>
          </div>
        </div>
        <div class="field">
          <span class="label" data-i18n="des.coverImg"></span>
          <div class="row">
            <label class="btn btn-file"><input type="file" id="cover" accept="image/jpeg,image/png,image/webp"><span>JPG / PNG</span></label>
            <button type="button" class="link" id="cover-clear" data-i18n="des.remove" hidden></button>
            <span class="muted small" data-i18n="des.coverImgHint"></span>
          </div>
        </div>
        <div class="grid2">
          <label class="field compact"><span class="label" data-i18n="des.bookLang"></span>
            <select name="lang"><option value="hu">Magyar</option><option value="en">English</option></select></label>
          <label class="field compact"><span class="label" data-i18n="des.units"></span>
            <select name="units"><option value="auto" data-i18n="des.unitsAuto"></option><option value="metric" data-i18n="des.metric"></option><option value="imperial" data-i18n="des.imperial"></option></select></label>
        </div>
      </section>

      <section class="card step">
        <header class="step-head"><span class="step-no">4</span><h2 data-i18n="step.content"></h2></header>
        <div class="grid2">
          <label class="field compact"><span class="label" data-i18n="con.chapters"></span>
            <select name="chapters"><option value="year" data-i18n="ch.year"></option><option value="season" data-i18n="ch.season"></option><option value="month" data-i18n="ch.month"></option><option value="sport" data-i18n="ch.sport"></option><option value="none" data-i18n="ch.none"></option></select></label>
          <label class="field compact"><span class="label" data-i18n="con.order"></span>
            <select name="order"><option value="asc" data-i18n="ord.asc"></option><option value="desc" data-i18n="ord.desc"></option></select></label>
        </div>
        <div class="field">
          <span class="label" data-i18n="con.stats"></span>
          <div class="chips" id="stat-chips"></div>
        </div>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" name="showMaps" checked><span data-i18n="con.maps"></span></label>
          <label class="toggle"><input type="checkbox" name="elevation" checked><span data-i18n="con.elevation"></span></label>
          <label class="toggle"><input type="checkbox" name="showDescriptions" checked><span data-i18n="con.descriptions"></span></label>
          <label class="toggle"><input type="checkbox" name="showCaptions" checked><span data-i18n="con.captions"></span></label>
          <label class="toggle"><input type="checkbox" name="toc" checked><span data-i18n="con.toc"></span></label>
          <label class="toggle"><input type="checkbox" name="yearPages" checked><span data-i18n="con.yearPages"></span></label>
          <label class="toggle"><input type="checkbox" name="routesPage" checked><span data-i18n="con.routesPage"></span></label>
          <label class="toggle"><input type="checkbox" name="listNoPhoto" checked><span data-i18n="con.log"></span></label>
          <label class="toggle"><input type="checkbox" name="mapPins" checked><span data-i18n="con.pins"></span></label>
          <label class="toggle"><input type="checkbox" name="runningHeads" checked><span data-i18n="con.runningHeads"></span></label>
        </div>
        <p class="muted small" data-i18n="con.apiNote"></p>
        <div class="grid2">
          <label class="field compact"><span class="label" data-i18n="con.privacy"></span>
            <select name="privacyMeters" id="privacy"></select></label>
          <label class="field compact"><span class="label" data-i18n="con.routeColor"></span>
            <select name="routeColor"><option value="accent" data-i18n="rc.accent"></option><option value="ink" data-i18n="rc.ink"></option></select></label>
        </div>
        <label class="field"><span class="label"><span data-i18n="con.afterword"></span> <span class="muted" data-i18n="des.optional"></span></span>
          <textarea name="afterword" rows="3" maxlength="2000" data-i18n-ph="con.afterwordPh"></textarea></label>
        <label class="field compact narrow"><span class="label" data-i18n="con.notes"></span>
          <select name="notesPages"><option value="0">0</option><option value="2">2</option><option value="4">4</option><option value="8">8</option></select></label>
      </section>

      <section class="card step">
        <header class="step-head"><span class="step-no">5</span><h2 data-i18n="step.print"></h2></header>
        <div class="field">
          <span class="label" data-i18n="pr.quality"></span>
          <div class="seg">
            <label><input type="radio" name="quality" value="print" checked><span data-i18n="pr.print"></span></label>
            <label><input type="radio" name="quality" value="screen"><span data-i18n="pr.screen"></span></label>
          </div>
        </div>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" name="bleed" checked><span data-i18n="pr.bleed"></span></label>
          <label class="toggle"><input type="checkbox" name="cropMarks"><span data-i18n="pr.marks"></span></label>
          <label class="toggle"><input type="checkbox" name="gutter" checked><span data-i18n="pr.gutter"></span></label>
          <label class="toggle"><input type="checkbox" name="padToFour" checked><span data-i18n="pr.pad"></span></label>
          <label class="toggle"><input type="checkbox" name="split"><span data-i18n="pr.split"></span></label>
          <label class="toggle"><input type="checkbox" name="coverSpread"><span data-i18n="pr.spread"></span></label>
        </div>
        <div class="grid2" id="spread-opts" hidden>
          <label class="field compact"><span class="label" data-i18n="pr.paper"></span>
            <select name="paper"><option value="thin" data-i18n="pr.thin"></option><option value="standard" selected data-i18n="pr.standard"></option><option value="thick" data-i18n="pr.thick"></option></select></label>
          <label class="field compact"><span class="label" data-i18n="pr.spine"></span>
            <input type="number" name="spineMm" min="0" max="80" step="0.1" data-i18n-ph="pr.spineAuto"></label>
        </div>
        <p class="muted small" data-i18n="pr.hint"></p>
      </section>

      <section class="card step photos" id="step-photos" hidden>
        <header class="step-head"><span class="step-no step-icon" aria-hidden="true">↓</span><h2 data-i18n="ph.title"></h2></header>
        <p class="muted" data-i18n="ph.lead"></p>
        <p class="small" id="photos-status"></p>
        <div class="row">
          <button type="button" id="photos-zip-all" class="btn" data-i18n="ph.zipAll"></button>
          <button type="button" id="photos-fetch" class="btn" data-i18n="ph.fetch" hidden></button>
        </div>
        <div class="bar slim" id="photos-bar" hidden><div></div></div>
        <details class="picker" id="photo-browser">
          <summary><span data-i18n="ph.browse"></span> <span id="photos-sel-count" class="muted"></span></summary>
          <div class="picker-tools">
            <button type="button" class="link" id="photos-all" data-i18n="sel.allBtn"></button>
            <button type="button" class="link" id="photos-none" data-i18n="sel.noneBtn"></button>
            <button type="button" class="btn btn-small btn-primary" id="photos-dl-sel" disabled></button>
          </div>
          <div class="photo-groups" id="photo-groups"></div>
        </details>
      </section>
    </form>

    <aside class="panel">
      <div class="panel-inner card">
        <h2 data-i18n="panel.title"></h2>
        <div class="book-stage">
          <div class="book" id="mock">
            <div class="book-cover" id="mock-cover">
              <svg class="book-routes" viewBox="0 0 120 80" aria-hidden="true"><path d="M8 60c10-25 22-30 30-18s12 14 20-4 18-22 26-8 12 20 28 6"/><path d="M14 72c14-8 30-6 40-14s20-6 30 2 18 6 28-4"/></svg>
              <div class="book-bar"></div>
              <div class="book-title" id="mock-title">Lap by Lap</div>
              <div class="book-sub" id="mock-sub"></div>
              <div class="book-meta" id="mock-meta"></div>
            </div>
          </div>
        </div>
        <dl class="facts">
          <div><dt data-i18n="panel.acts"></dt><dd id="f-acts">–</dd></div>
          <div><dt data-i18n="panel.photos"></dt><dd id="f-photos">–</dd></div>
          <div><dt>PDF</dt><dd id="f-pages">–</dd></div>
        </dl>
        <div class="eta" id="eta" hidden>
          <span class="label" data-i18n="panel.time"></span>
          <strong id="eta-value"></strong>
          <p class="small muted" id="eta-why"></p>
          <p class="small tip" id="eta-tip" data-i18n="panel.archiveTip" hidden></p>
        </div>
        <div class="panel-actions">
          <button type="button" id="preview" class="btn" data-i18n="panel.preview"></button>
          <button type="button" id="build" class="btn btn-primary" data-i18n="panel.build"></button>
        </div>

        <div id="progress" class="progress" hidden>
          <p class="label" id="progress-phase"></p>
          <div class="bar"><div id="progress-bar"></div></div>
          <p id="progress-count" class="small muted"></p>
          <div id="progress-wait" class="wait" hidden>
            <p id="progress-wait-text"></p>
            <button type="button" id="skip" class="btn btn-small" data-i18n="prog.skip"></button>
            <p class="small" data-i18n="prog.skipHint"></p>
          </div>
        </div>
        <div id="result" class="result" hidden></div>
      </div>

      <section class="card books">
        <h2 data-i18n="books.title"></h2>
        <ul id="books"></ul>
        <button type="button" id="forget" class="link danger" data-i18n="nav.forget"></button>
      </section>
    </aside>
  </main>

  <dialog id="viewer" class="viewer">
    <div class="viewer-head">
      <strong data-i18n="res.previewTitle"></strong>
      <form method="dialog"><button class="btn btn-small" aria-label="Close">✕</button></form>
    </div>
    <iframe id="viewer-frame" title="PDF"></iframe>
  </dialog>

  <form id="photo-dl" method="post" action="/api/photos/zip" hidden>
    <input type="hidden" name="ids">
    <input type="hidden" name="all">
  </form>

  <footer class="foot"><span data-i18n="foot"></span> <span id="lang-note" class="muted"></span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
